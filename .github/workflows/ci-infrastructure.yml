name: CI - infrastructure

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/AppHost/**'
      - 'src/ServiceDefaults/**'
      - 'tests/AppHost.Tests/**'
      - 'tests/ServiceDefaults.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-infrastructure.yml'
  pull_request:
    paths:
      - 'src/AppHost/**'
      - 'src/ServiceDefaults/**'
      - 'tests/AppHost.Tests/**'
      - 'tests/ServiceDefaults.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-infrastructure.yml'
  # Every service calls AddServiceDefaults() and is declared in AppHost, so a service's CI
  # can also run this workflow as a `needs:` job.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test ServiceDefaults
        run: dotnet test --project tests/ServiceDefaults.Tests/ServiceDefaults.Tests.csproj --configuration Release

      - name: Build and test AppHost
        run: dotnet test --project tests/AppHost.Tests/AppHost.Tests.csproj --configuration Release
