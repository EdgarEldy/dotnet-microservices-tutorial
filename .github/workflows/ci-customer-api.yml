name: CI - customer-api

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Customer.API/**'
      - 'tests/Customer.API.Tests/**'
      # order-api's committed contract: a consumer change re-verifies this provider
      - 'pacts/order-api-customer-api.json'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-customer-api.yml'
  pull_request:
    paths:
      - 'src/Customer.API/**'
      - 'tests/Customer.API.Tests/**'
      # order-api's committed contract: a consumer change re-verifies this provider
      - 'pacts/order-api-customer-api.json'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-customer-api.yml'

jobs:
  # customer-api compiles against Common.Lib: only build it once Common.Lib is green.
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Includes PactTests: customer-api verified against order-api's committed pact file.
      - name: Build and test Customer.API
        env:
          PACT_DO_NOT_TRACK: 'true'
        run: dotnet test --project tests/Customer.API.Tests/Customer.API.Tests.csproj --configuration Release
