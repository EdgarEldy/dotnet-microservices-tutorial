name: CI - catalog-api

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Catalog.API/**'
      - 'tests/Catalog.API.Tests/**'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-catalog-api.yml'
  pull_request:
    paths:
      - 'src/Catalog.API/**'
      - 'tests/Catalog.API.Tests/**'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-catalog-api.yml'

jobs:
  # catalog-api compiles against Common.Lib: only build it once Common.Lib is green.
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test Catalog.API
        run: dotnet test --project tests/Catalog.API.Tests/Catalog.API.Tests.csproj --configuration Release
