name: CI - notification-worker

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Notification.Worker/**'
      - 'src/Contracts/**'
      - 'tests/Notification.Worker.Tests/**'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-notification-worker.yml'
  pull_request:
    paths:
      - 'src/Notification.Worker/**'
      - 'src/Contracts/**'
      - 'tests/Notification.Worker.Tests/**'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-notification-worker.yml'

jobs:
  # notification-worker compiles against Common.Lib: only build it once Common.Lib is green.
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test Notification.Worker
        run: dotnet test --project tests/Notification.Worker.Tests/Notification.Worker.Tests.csproj --configuration Release
