name: CI - identity-api

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Identity.API/**'
      - 'src/Contracts/**'
      - 'tests/Identity.API.Tests/**'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-identity-api.yml'
  pull_request:
    paths:
      - 'src/Identity.API/**'
      - 'src/Contracts/**'
      - 'tests/Identity.API.Tests/**'
      - 'src/Common.Lib/**'
      - 'src/ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci-identity-api.yml'

jobs:
  common-lib:
    uses: ./.github/workflows/ci-common-lib.yml

  build:
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Testcontainers starts its own PostgreSQL and Kafka containers through the
      # Docker daemon already available on ubuntu-latest: nothing to provision here.
      - name: Build and test identity-api
        run: dotnet test --project tests/Identity.API.Tests/Identity.API.Tests.csproj --configuration Release
